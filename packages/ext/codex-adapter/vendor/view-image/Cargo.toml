[workspace]
members = ["view-image/rust", "rust/crates/codex-utils-image"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.0.0"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22.1"
codex-utils-image = { path = "rust/crates/codex-utils-image" }
image = { version = "^0.25.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
