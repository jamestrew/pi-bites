[package]
name = "codex-web-run"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[[bin]]
name = "web_run"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures-util = "=0.3.31"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
  "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
